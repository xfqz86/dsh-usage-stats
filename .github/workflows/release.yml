# 发布到 npm 与交付 tarball
# 触发：推送 v* 标签（v0.1.0、v0.2.0-rc.1 等）或手动 workflow_dispatch
# 依赖：tag 推送时强制校验 CI（job verify）在该提交上已成功；workflow_dispatch 仅构建不发布，不校验
# 产物：
#   - npmjs：@xfqz86/dsh-usage-stats（预构建 lib，无 prepare，避免安装时 build 脚本授权）
#   - tarball：GitHub Release 附件 + workflow artifact（pnpm pack 产物）
#   - GitHub 安装：依赖 prepare + release 分支（见 release-branch.yml），此处仅校验
#
# npm 发布方式（择一）：
#   1) OIDC trusted publishing（推荐，无 token）—— 在 npmjs.com 为包配置 trusted publisher：
#        指向本仓库、本 workflow（release.yml）、environment npm
#      参考 dsh-tui/dsh-tui 的 release.yml
#   2) NPM_TOKEN secret —— 在仓库 Settings → Secrets 中配置 NPM_TOKEN
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate — CI must pass
    # 仅 tag 推送时校验 CI；workflow_dispatch 跳过校验（仅构建产物，不发布）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: ./.github/actions/gate
        with:
          sha: ${{ github.sha }}
          workflow: CI
          job: verify
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build npm package
    # gate 成功或被跳过（workflow_dispatch）时才构建；gate 失败则阻断
    needs: gate
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Validate tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          echo "tag: $tag_version  package: $package_version"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "::error::Tag version $tag_version does not match package.json $package_version"
            exit 1
          fi

      - name: Build (production, minified, no map)
        run: NODE_ENV=production pnpm build

      - name: Smoke tests
        run: |
          node test/smoke.mjs
          node test/client-bundle.mjs

      - name: Verify tag version (workflow_dispatch guard)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "workflow_dispatch build at $(node -p "require('./package.json').version") — will pack but not publish"

      - uses: ./.github/actions/prune-package

      - name: Create tarball
        id: pack
        shell: bash
        run: |
          mkdir -p package
          NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache" npm pack --pack-destination "$GITHUB_WORKSPACE/package"
          # 固定文件名别名：供 README 的 stable tarball 地址使用，地址永不变动
          versioned=$(ls package/xfqz86-dsh-usage-stats-*.tgz 2>/dev/null | head -n1)
          if [ -n "$versioned" ]; then
            cp "$versioned" package/xfqz86-dsh-usage-stats.tgz
            echo "created stable alias: $(basename "$versioned")"
          fi
          ls -lh package/
          echo "versioned=$versioned" >> "$GITHUB_OUTPUT"

      - name: Verify tarball (6 files, pruned package.json)
        uses: ./.github/actions/verify-pack
        with:
          path: ${{ steps.pack.outputs.versioned }}

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm & GitHub Release
    needs: build
    # 仅标签推送才发布；workflow_dispatch 仅构建产物，不发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@xfqz86/dsh-usage-stats
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use OIDC-capable npm CLI
        run: npm install --global npm@11

      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ls -lh package/
          # 仅发布版本化包，stable 别名（xfqz86-dsh-usage-stats.tgz）仅供 GitHub Releases 固定地址使用，不发到 npm
          # 优先 OIDC（trusted publishing，需在 npmjs 配置 publisher 指向本仓库 workflow=release.yml + environment=npm）
          # 若提供 NPM_TOKEN secret，则回退到 token 方式（兼容旧流程）
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing with NPM_TOKEN..."
            npm publish ./package/xfqz86-dsh-usage-stats-*.tgz --access public
          else
            echo "Publishing with OIDC (trusted publishing)..."
            npm publish ./package/xfqz86-dsh-usage-stats-*.tgz --access public --provenance
          fi

      - name: Create GitHub Release with tarball
        uses: softprops/action-gh-release@v2
        with:
          files: package/*.tgz
          generate_release_notes: true
          # tag 已由 push 事件创建，release 标题与正文基于 tag 自动生成
