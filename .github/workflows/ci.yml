# CI：类型检查、目录结构新鲜度、文档归属与一致性、生产态构建、样式契约与冒烟测试、prepare 校验、剪枝与打包校验
# 每次 PR 与推送到 dev/main 均执行，确保发布前的完整性（dev 为开发分支，main 为生产分支）；main 通过后由 release-branch.yml 同步交付物。
name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Docs — STRUCTURE.md freshness (fix with pnpm tree)
        run: pnpm tree:check || (echo "::error::docs/STRUCTURE.md 已过期；运行 pnpm tree 重新生成并同批提交" && exit 1)

      - name: Docs — ownership & consistency
        run: node .agents/skills/doc-review/scripts/check-docs.mjs

      - name: Build (production, minified, no map)
        run: NODE_ENV=production pnpm build

      - name: Build determinism (same source, same bytes)
        shell: bash
        run: |
          # 同一份源码两次构建必须逐字节一致：发版产物在 release 分支与 npm 是两处交付，
          # 构建一旦漂移就会对不上（历史上 CSS 类名映射顺序随机导致过这种差异）。
          before="$(sha256sum lib/index.js lib/client.js)"
          NODE_ENV=production pnpm build
          after="$(sha256sum lib/index.js lib/client.js)"
          if [[ "$before" != "$after" ]]; then
            echo "::error::生产构建不可复现：同一份源码两次构建字节不同"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
          echo "构建可复现：lib/index.js、lib/client.js 两次构建字节一致"

      - name: Styles — theme token contract (no harness checkout needed)
        run: node test/styles.mjs

      - name: Speed — model speed pure logic
        run: node --experimental-strip-types test/speed.mjs

      - name: Plugin page — locale metadata and detail links
        run: node test/plugin-page.mjs

      - name: Smoke — host (node:sqlite ledger + api)
        run: node test/smoke.mjs

      - name: Smoke — client bundle (ModuleLoader + CSS injection)
        run: node test/client-bundle.mjs

      - name: Verify prepare (git install path, before prune)
        run: test "$(node -p "require('./package.json').scripts.prepare")" = "tsdown" || (echo "::error::prepare must be tsdown" && exit 1)

      - uses: ./.github/actions/prune-package

      - name: Pack
        run: |
          mkdir -p /tmp/pack-test
          pnpm pack --pack-destination /tmp/pack-test

      - name: Verify pack (12 files, pruned package.json)
        uses: ./.github/actions/verify-pack
        with:
          path: /tmp/pack-test/*.tgz
