# CI：验证类型、构建与冒烟测试
# 每次 PR 与推送到 dev/main 均执行，确保发布前的完整性（dev 为开发分支，main 为生产分支）。
name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (production, minified, no map)
        run: NODE_ENV=production pnpm build

      - name: Smoke — host (node:sqlite ledger + api)
        run: node test/smoke.mjs

      - name: Smoke — client bundle (ModuleLoader + CSS injection)
        run: node test/client-bundle.mjs

      - name: Verify prepare (git install path, before prune)
        run: test "$(node -p "require('./package.json').scripts.prepare")" = "tsdown" || (echo "::error::prepare must be tsdown" && exit 1)

      - uses: ./.github/actions/prune-package

      - name: Pack
        run: |
          mkdir -p /tmp/pack-test
          pnpm pack --pack-destination /tmp/pack-test

      - name: Verify pack (6 files, pruned package.json)
        uses: ./.github/actions/verify-pack
        with:
          path: /tmp/pack-test/*.tgz
