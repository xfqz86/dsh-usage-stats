# 同步 release 分支（GitHub 安装路径 — 仅最终交付物）
# 目标：release 分支仅包含最终交付物（lib/ + package.json(已剪枝) + cordis.patch.yml + README.md + LICENSE），
#   不含任何源码（src/、tsconfig、scripts、test、.github 等），满足：
#     dsh plugin --profile demo add github:xfqz86/dsh-usage-stats#release
#   dev 分支的源码安装仍通过 prepare 自构建（github:xfqz86/dsh-usage-stats），release 分支则为预构建的最小形态。
#
# 触发：
#   - CI 在 main 分支成功后自动同步（workflow_run 监听 CI 的 completed 事件，仅 success 才执行）
#   - 手动 workflow_dispatch（不受 CI 限制，用于应急重推）
#
# 实现：构建 lib（压缩，无 map）→ 剪枝 package.json → 组装 payload（5 项）→ 以 orphan/clean 方式覆盖 release 分支
name: sync-release-branch
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  sync:
    name: sync release branch
    # 仅 CI 成功或手动触发才执行；workflow_run 需显式判断 conclusion
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          # workflow_run 触发时检出触发 CI 的提交，而非 workflow_run 自身的 SHA
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup

      - name: Build lib (production, minified, no map)
        run: NODE_ENV=production pnpm build

      - name: Verify lib
        run: |
          ls -lh lib/
          test -f lib/index.js || (echo "::error::lib/index.js missing" && exit 1)
          test -f lib/client.js || (echo "::error::lib/client.js missing" && exit 1)
          if [ -f lib/client.js.map ]; then echo "::error::lib/client.js.map should not exist (sourcemap disabled)"; exit 1; fi
          # 验证为压缩产物（minify 后应明显小于未压缩的 35k/116k）
          idx=$(wc -c < lib/index.js); cli=$(wc -c < lib/client.js)
          echo "lib ready — $idx bytes index, $cli bytes client (both minified, no map)"
          if [ "$cli" -gt 80000 ]; then echo "::warning::client.js >80k, may not be minified"; fi

      - name: Backup package.json
        run: cp package.json package.json.full

      - uses: ./.github/actions/prune-package

      - name: Assemble payload (only deliverables)
        run: |
          rm -rf /tmp/payload && mkdir -p /tmp/payload/lib
          cp -r lib/* /tmp/payload/lib/
          cp package.json /tmp/payload/package.json
          cp cordis.patch.yml /tmp/payload/cordis.patch.yml
          cp README.md /tmp/payload/README.md
          cp LICENSE /tmp/payload/LICENSE

      - name: Verify payload (6 files, pruned package.json)
        uses: ./.github/actions/verify-pack
        with:
          path: /tmp/payload

      - name: Sync to release branch (minimal, no source)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          COMMIT_MSG="chore(release): deliver $(node -p "require('/tmp/payload/package.json').version") for ${SOURCE_SHA}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 清理 prune 产生的脏工作区（payload 已备份至 /tmp），避免 checkout 失败
          # prune 步骤改写了 package.json 并生成 package.json.full / lib（未跟踪），直接 checkout 会因本地变更被拒
          git reset --hard HEAD
          git clean -fd

          # 准备 release 分支：若远端存在则检出，否则创建 orphan
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            echo "release branch exists — fetching"
            git fetch origin release:release
            git checkout -f release
          else
            echo "creating orphan release branch"
            git checkout --orphan release
          fi

          # 清空 release 分支所有内容（保留 .git/.github 以避免本地 Action 的 post 失败；.github 仅保留空目录不入提交）
          # git rm 仅删除非 .github 的已跟踪文件， payload 在 /tmp 不受影响
          if git ls-files -z | grep -zv "^\.github/" | grep -q .; then
            git ls-files -z | grep -zv "^\.github/" | xargs -0 -r git rm -rf -- 2>/dev/null || true
          fi
          # 兜底：物理删除残留的顶层文件/目录（除 .git/.github）
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} + 2>/dev/null || true
          echo "cleaned release branch, now empty except .git"
          ls -la

          # 写入 payload（仅 5 项）
          cp -r /tmp/payload/lib ./
          cp /tmp/payload/package.json ./
          cp /tmp/payload/cordis.patch.yml ./
          cp /tmp/payload/README.md ./
          cp /tmp/payload/LICENSE ./

          echo "=== release branch content ==="
          find . -mindepth 1 -maxdepth 1 ! -name '.git' | sort
          find . -type f | sort
          ls -lh lib/ package.json cordis.patch.yml README.md LICENSE

          # 校验 release 分支内容：仅允许的 5 顶层 + lib 内 2 文件（无 map，已压缩）
          if [ ! -f lib/index.js ] || [ ! -f lib/client.js ] || [ ! -f package.json ] || [ ! -f cordis.patch.yml ] || [ ! -f README.md ] || [ ! -f LICENSE ]; then
            echo "::error::release payload missing required files"
            exit 1
          fi
          if [ -f lib/client.js.map ]; then echo "::error::release contains client.js.map"; exit 1; fi
          if find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'lib' ! -name 'package.json' ! -name 'cordis.patch.yml' ! -name 'README.md' ! -name 'LICENSE' | grep -q .; then
            echo "::error::release branch contains unexpected top-level files"
            find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' | sort
            exit 1
          fi
          if find . -name "*.ts" -o -name "tsconfig.json" -o -name "pnpm-workspace.yaml" | grep -q .; then
            echo "::error::release branch contains source files"
            exit 1
          fi

          # 提交（即使 lib 已预构建，.gitignore 在 dev 中忽略 lib，但 release 分支已清空无 .gitignore，直接 add）
          git add lib package.json cordis.patch.yml README.md LICENSE
          if git diff --cached --quiet; then
            echo "No changes to release branch — already up to date"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push origin release
          echo "pushed release branch at $(git rev-parse HEAD)"

      - name: Summary
        run: |
          echo "release branch synced — minimal deliverables only:"
          echo "  lib/ package.json cordis.patch.yml README.md LICENSE"
          echo "users can now install via:"
          echo "  dsh plugin --profile demo add github:xfqz86/dsh-usage-stats#release"
