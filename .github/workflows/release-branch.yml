# 同步 release 分支（GitHub 预构建安装路径 — 仅最终交付物）
# 目标：release 分支跟随 main 最新提交，内容是该提交的生产构建交付物。
#   与 npm 包（同一 commit 打 tag 时发布）及 GitHub Release tarball 是同一份 12 文件清单：
#   三者都走「剪枝 package.json + npm pack」这一条流程，本分支逐项比对打包结果；
#   加上构建可复现（同一 commit 两次生产构建逐字节一致，CI 有二次构建比对门禁），
#   所以同一个 commit 的 release 分支与 npm 包逐字节相同。
# 触发：
#   - main 的 CI 成功后自动同步（workflow_run 监听 CI completed，仅 success 执行）
#   - 手动 workflow_dispatch（不受 CI 限制，用于应急重推）
# 实现：构建 lib（压缩，无 map）→ 剪枝 package.json → npm pack → verify-pack 校验 → 解包铺到分支
name: sync-release-branch
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  sync:
    name: sync release branch
    # 仅 CI 成功或手动触发才执行；workflow_run 需显式判断 conclusion
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          # workflow_run 触发时检出触发 CI 的提交，而非 workflow_run 自身的 SHA
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup

      - name: Build lib (production, minified, no map)
        run: NODE_ENV=production pnpm build

      - name: Verify lib
        run: |
          ls -lh lib/
          test -f lib/index.js || (echo "::error::lib/index.js missing" && exit 1)
          test -f lib/client.js || (echo "::error::lib/client.js missing" && exit 1)
          if [ -f lib/client.js.map ]; then echo "::error::lib/client.js.map should not exist (sourcemap disabled)"; exit 1; fi
          # 体量哨兵：minify 后 client.js 仍超过 80k 时告警，提示可能没压缩
          idx=$(wc -c < lib/index.js); cli=$(wc -c < lib/client.js)
          echo "lib ready — $idx bytes index, $cli bytes client (both minified, no map)"
          if [ "$cli" -gt 80000 ]; then echo "::warning::client.js >80k, may not be minified"; fi

      - name: Backup package.json
        run: cp package.json package.json.full

      - uses: ./.github/actions/prune-package

      - name: Pack deliverables (same shape as npm)
        shell: bash
        run: |
          mkdir -p /tmp/pkg
          NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache" npm pack --pack-destination /tmp/pkg
          ls -lh /tmp/pkg

      - name: Verify tarball (12 files, pruned package.json)
        uses: ./.github/actions/verify-pack
        with:
          path: /tmp/pkg/*.tgz

      - name: Sync to release branch (same tarball as npm)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          COMMIT_MSG="chore(release): deliver $(node -p "require('./package.json').version") for ${SOURCE_SHA}"

          tgz=$(ls /tmp/pkg/*.tgz | head -n1)
          rm -rf /tmp/payload && mkdir -p /tmp/payload
          tar -xzf "$tgz" -C /tmp/payload --strip-components=1
          echo "=== packed payload ==="
          find /tmp/payload -type f | sort

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 清理 prune 产生的脏工作区（payload 已备份至 /tmp），避免 checkout 失败
          git reset --hard HEAD
          git clean -fd

          # 备份本地 Action 供 post 恢复（checkout release 会移除 .github）
          if [ -d .github ]; then cp -r .github /tmp/.github.bak; fi

          # 准备 release 分支：若远端存在则检出，否则创建 orphan（问远端，不用可能过期的本地跟踪引用）
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            echo "release branch exists — fetching"
            git fetch origin "+refs/heads/release:refs/remotes/origin/release"
            git checkout -f -B release origin/release
          else
            echo "creating orphan release branch"
            git checkout --orphan release
          fi

          # 恢复 .github 供后续 post 使用（不入提交，仅保留目录）
          if [ -d /tmp/.github.bak ]; then mkdir -p .github; cp -r /tmp/.github.bak/* .github/ 2>/dev/null || true; fi

          # 清空分支内容：索引整份清掉（orphan 首次创建时，索引里还留着 main 的文件，含 .github），
          # 工作树只保留 .git/.github（.github 供本地 Action 收尾，不入提交）
          git rm -r --cached --quiet . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} + 2>/dev/null || true
          echo "cleaned release branch, now empty except .git"

          # 原样铺入打包内容：与 npm 包同一份文件、同一份字节
          cp -a /tmp/payload/. ./
          echo "=== release branch content ==="
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' | sort
          find . -type f ! -path './.git/*' ! -path './.github/*' | sort

          # 与打包清单逐项比对：少一个、多一个都算失败
          expected=$(cd /tmp/payload && find . -type f | sed 's|^\./||' | sort)
          actual=$(find . -type f ! -path './.git/*' ! -path './.github/*' | sed 's|^\./||' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "::error::release branch content differs from the packed payload"
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          if find . -type f ! -path './.git/*' ! -path './.github/*' -name '*.ts' | grep -q .; then
            echo "::error::release branch contains TypeScript sources"
            exit 1
          fi
          if find . -name 'client.js.map' | grep -q .; then echo "::error::release branch contains client.js.map"; exit 1; fi

          # 提交：只 add 打包清单里的顶层项（.github 是本地 Action 的备份，不入提交；
          # 旧内容的删除已由上面的 git rm 暂存）
          git add -A -- lib package.json cordis.patch.yml icon.svg README.md CHANGELOG.md LICENSE locale docs
          if git ls-files | grep -q '^\.github/'; then
            echo "::error::release branch would commit .github"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No changes to release branch — already up to date"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push origin release
          echo "pushed release branch at $(git rev-parse HEAD)"

      - name: Summary
        run: |
          echo "release branch synced — same 12-file payload as the npm package:"
          echo "  lib/ package.json cordis.patch.yml icon.svg README.md CHANGELOG.md LICENSE locale/ docs/"
          echo "users can now install via:"
          echo "  dsh plugin --profile web add github:xfqz86/dsh-usage-stats#release"
