name: verify-pack
description: Verify distribution contains only the whitelisted files (lib, locale, detail docs) and pruned package.json
author: xfqz86

branding:
  icon: package
  color: green

inputs:
  path:
    description: Path to tarball (.tgz) or payload directory to verify
    required: true
  allow:
    description: Comma-separated allowlist for package.json
    required: false
    default: "name,version,description,icon,type,main,exports,files,engines,dsh,license,repository,dependencies,peerDependencies"

runs:
  using: node24
  main: verify.mjs
